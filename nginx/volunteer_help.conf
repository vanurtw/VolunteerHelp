server{
listen 8088;

charset utf8;

access_log /app/www/volunteer_help/logs/volunteer_help_access.log;
error_log /app/www/volunteer_help/logs/volunteer_help_error.log error;

location / {
    proxy_pass http://volunteer_help:8000;
    proxy_set_header X-Url-Scheme $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;

}

location /static/ {
    root /app/www/volunteer_help/;
}
}